<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防御塔自动战斗 - 重构版</title>
<style>
/* ==================== 统一设计语言（Design Tokens） ==================== */
:root {
  /* 表面层次 */
  --bg:        #0b0e13;
  --bg-deep:   #070a0e;
  --surface:   rgba(22, 27, 34, 0.72);
  --surface-2: rgba(28, 35, 43, 0.85);
  --surface-3: rgba(38, 47, 58, 0.9);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-highlight: rgba(255, 255, 255, 0.04);
  /* 文本 */
  --text:      #e8eef5;
  --text-dim:  #8b96a5;
  --text-mute: #5a6472;
  /* 主题色 */
  --accent:      #4fd1c5;   /* 主青 */
  --accent-2:    #5b9bd5;   /* 蓝 */
  --warn:        #e0473f;   /* 红 */
  --gold:        #f6c94a;   /* 金（增益/龙魂） */
  --good:        #4caf50;
  --purple:      #bb86fc;
  /* 尺度 */
  --radius:    12px;
  --radius-sm: 8px;
  --radius-xs: 5px;
  --gap:       10px;
  --gap-sm:    6px;
  --shadow:    0 8px 28px rgba(0,0,0,0.45);
  --shadow-sm: 0 3px 12px rgba(0,0,0,0.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(79,209,197,0.06), transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, rgba(91,155,213,0.05), transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 13px; height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }

/* ==================== 顶栏 ==================== */
/* v44：顶栏改为**悬浮**（用户："顶栏也可以做成悬浮那种"）。
   与右下角工具栏、右上角世界小窗共用同一套玻璃面板参数（surface + blur + 圆角 + 边框 + 阴影），
   三块浮层这才看起来是同一套东西 —— 这就是"UI 要统一"落到具体处的样子。
   贴边的 border-bottom 换成整圈 border，否则悬浮起来之后底边那道线会很突兀。 */
#topbar {
  position: absolute; top: 10px; left: 12px; right: 12px;
  display: flex; align-items: center; gap: 16px; padding: 8px 14px;
  background: var(--surface);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border); border-radius: var(--radius-sm);
  flex-shrink: 0; flex-wrap: wrap; z-index: 20;
  box-shadow: var(--shadow-sm);
}
#topbar .stat { color: var(--text-dim); font-size: 12.5px; letter-spacing: 0.2px; }
#topbar .stat b { color: var(--text); font-variant-numeric: tabular-nums; }
#topbar .sep { color: var(--glass-border); }
#topbar .spacer { flex: 1; }
.btn-group { display: flex; gap: var(--gap-sm); flex-wrap: wrap; align-items: center; }

button {
  background: var(--surface-3); border: 1px solid var(--glass-border); color: var(--text);
  font-family: inherit; font-size: 12px; padding: 6px 12px;
  border-radius: var(--radius-xs); cursor: pointer;
  transition: transform 0.12s ease, background 0.15s, border-color 0.15s, box-shadow 0.15s;
  white-space: nowrap;
}
button:hover { background: rgba(58,70,86,0.95); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
button:active { transform: translateY(0); }
button.primary { background: linear-gradient(135deg, rgba(79,209,197,0.22), rgba(91,155,213,0.22)); border-color: rgba(79,209,197,0.4); color: #cffcf6; }
button.primary:hover { background: linear-gradient(135deg, rgba(79,209,197,0.34), rgba(91,155,213,0.34)); }
button.success { background: rgba(42,122,74,0.28); border-color: rgba(76,175,80,0.4); color: #b6f0c4; }
button.success:hover { background: rgba(42,122,74,0.45); }
button.danger { background: rgba(179,58,58,0.24); border-color: rgba(224,71,63,0.4); color: #ffc9c5; }
button.danger:hover { background: rgba(179,58,58,0.4); }
button.dragon { background: linear-gradient(135deg, rgba(246,201,74,0.25), rgba(230,126,34,0.22)); border-color: rgba(246,201,74,0.45); color: #ffe9a8; }
button.dragon:hover { background: linear-gradient(135deg, rgba(246,201,74,0.38), rgba(230,126,34,0.34)); }

/* ==================== 龙魂提示条 ==================== */
#dragonBanner {
  display: none; align-items: center; gap: 12px;
  padding: 7px 18px; font-size: 12.5px; font-weight: 600;
  background: linear-gradient(90deg, rgba(230,126,34,0.2), rgba(246,201,74,0.12), transparent);
  border-bottom: 1px solid rgba(246,201,74,0.25);
  color: var(--gold); flex-shrink: 0; z-index: 15;
  animation: dragonPulse 2s ease-in-out infinite;
}
#dragonBanner.show { display: flex; }
@keyframes dragonPulse { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
#dragonBanner .db-timer { color: var(--text); font-variant-numeric: tabular-nums; }

#main { display: flex; flex: 1; min-height: 0; }

/* ==================== 侧栏 ==================== */
/* ==================== 点选属性面板（替代常驻侧栏） ==================== */
/* v44：顶栏改悬浮之后要给它让位（原来 top:12px 会盖住顶栏左半边的波次/塔数）。
   玻璃参数也与另外三块浮层统一 —— 四块浮层同一套 surface + blur(14) + 圆角 + 边框。 */
#selectionPanel {
  position: absolute; top: 66px; left: 12px; width: 320px; max-width: 82vw;
  max-height: calc(100% - 78px); overflow-y: auto; z-index: 30;
  background: var(--surface); border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: none;
  box-shadow: var(--shadow-sm);
}
#selectionPanel.show { display: block; }
#selectionHeader {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; border-bottom: 1px solid var(--glass-border, rgba(255,255,255,0.08));
  font-size: 13px; color: var(--accent, #6fd3c7); position: sticky; top: 0;
  background: inherit; z-index: 1;
}
#selectionActions button {
  background: var(--surface-3, rgba(255,255,255,0.06)); border: 1px solid var(--glass-border, rgba(255,255,255,0.10));
  color: var(--text-dim, #8a93a3); cursor: pointer; font-size: 12px; padding: 2px 7px; border-radius: 6px;
}
#selectionActions button:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
#selectionBadge .type-tag { font-size: 10px; padding: 2px 7px; border-radius: 999px; }
#selectionCard { padding: 8px; }
#selectionCard .unit-card { margin: 0; }
#perfHud {
  position: absolute; right: 12px; top: 54px; z-index: 30; display: none; /* v33：右上角让给天气条 */
  font: 11px/1.6 ui-monospace, monospace; color: #9fe8dc; text-align: right;
  background: rgba(10,13,18,0.75); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; padding: 6px 10px; pointer-events: none; white-space: pre;
}
#perfHud.show { display: block; }

/* 常驻侧栏（leftPanel/rightPanel）已随点选面板改造彻底移除，死 CSS 已清除 */

/* ==================== 单位属性面板：天气影响（三角形·外边框分段点亮，v33） ==================== */
/* 档位由三角形【外边框的分段点亮】表达（逆时针 右→底→左）：
   轻微 = 不点亮 / 有限 = 1 条边 / 中等 = 2 条边 / 严重 = 3 条边全亮。
   极端天气自带辉光，第 5 档"极端"叠加重辉光。下方 3 格进度已删除（v33）。 */
.weather-row {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.wx-tri {
  position: relative; width: 34px; height: 32px;
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: flex-start; justify-content: center;
  transition: transform 0.12s;
}
.wx-tri:hover { transform: translateY(-1px); }
/* 极端天气：只要出现就自带辉光 */
.wx-tri.extreme { filter: drop-shadow(0 0 4px rgba(255,215,94,0.55)); }
/* 第 5 档"极端"（充能≥88%）：重辉光 */
.wx-tri.tier-extreme { filter: drop-shadow(0 0 8px rgba(255,215,94,0.95)) drop-shadow(0 0 3px rgba(255,255,255,0.5)); }
.wx-tri-svg {
  position: absolute; top: 0; left: 0;
  width: 34px; height: 30px; pointer-events: none;
}
.wx-tri-ic {
  position: absolute; top: 13px; left: 0; right: 0;
  text-align: center; font-size: 12px; line-height: 1;
  pointer-events: none;
}

/* ==================== 单位属性面板：世界影响（昼夜/熵/龙魂）====================
   与上面的天气行【共用同一套视觉语言】：同款 34px 三角格 + 边框点亮 + 图标，
   悬停看明细。区别只在颜色语义：蓝=秩序侧受益 / 红=混乱侧受益 / 灰=无修正。
   为什么复用而不是新做一种：天气与熵都是"世界给这个单位的修正"，
   同一类信息用两种控件表达，用户得学两遍。 */
/* v44：天气行与世界行合并成**一栏**（用户："属性栏的天气显示应该和天气是在同一栏的，
   而不是像现在的两栏"）。两者本来就是同一类信息（世界给这个单位的修正）、
   用的也是同一套三角格控件，分成上下两行只会让人以为是两回事。
   DOM 上仍保留两个盒子（各自有独立的刷新节流与脏检查），
   外面套一个 .state-row 让它们排在同一行 —— 合的是版式，不是刷新逻辑。 */
/* v44：可点击的属性行（点开看该属性的结算规则）。
   只给下划虚线 + 手型，不改颜色 —— 属性面板一屏十几行，
   全部高亮反而让人不知道该看哪一行。 */
.a.stat-doc { cursor: pointer; }
.a.stat-doc label { border-bottom: 1px dashed rgba(255,255,255,0.22); }
.a.stat-doc:hover label { border-bottom-color: rgba(255,255,255,0.6); color: var(--text); }

.state-row {
  margin-top: 8px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
}
.state-row .weather-row,
.state-row .world-row { margin-top: 0; }
.world-row {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.wx-tri.wx-order  { filter: drop-shadow(0 0 4px rgba(91,155,213,0.45)); }
.wx-tri.wx-chaos  { filter: drop-shadow(0 0 4px rgba(224,71,63,0.45)); }

/* ==================== 世界状态小窗（时间 · 天气 · 熵）====================
   三段共用一个玻璃面板、逐行显示。统一设计语言的三条：
     ① 每行都是 [固定宽标签] [等宽色带] [固定宽读数] —— 三列纵向对齐，
        数值长短变化不会让色带左右跳动（天气条以前就吃过这个亏）；
     ② 色带尺寸/行高/字号三段完全一致，一眼看出是同一组信息；
     ③ 只有"当前值"上主界面，所有明细都在各自的配置面板里。 */
/* v44：顶栏改成悬浮之后要给它让位（原来 top:12px 会被压在顶栏底下）。
   玻璃参数也与顶栏/右下角工具栏统一 —— 三块浮层同一套 surface + blur(14) + 圆角 + 边框。
   之前三块各写各的（0.90 实心底 / blur10 / 8px 圆角），并排看得出来不是一套。 */
#worldHud {
  position: absolute; top: 66px; right: 12px;
  z-index: 25;
  display: flex; flex-direction: column; gap: 3px;
  padding: 8px 14px; border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow-sm);
}
#worldHud .wh-row {
  display: flex; align-items: center; gap: 6px;
  height: 18px;
}
#worldHud .wh-row[title]:not(#whTimeRow) { cursor: pointer; }
#worldHud .wh-row:not(#whTimeRow):hover .wh-bar { outline: 1px solid rgba(255,255,255,0.28); }
/* 固定宽度 + 左对齐：标签长短不一时，色带不会跟着左右跳动 */
#worldHud .wh-label {
  font-size: 11px; font-weight: 600; flex-shrink: 0;
  display: flex; align-items: center; gap: 3px;
  width: 62px; overflow: hidden; white-space: nowrap;
}
#worldHud .wh-bar { width: 150px; height: 14px; display: block; flex-shrink: 0; border-radius: 2px; }
#worldHud .wh-val {
  font-size: 10px; font-variant-numeric: tabular-nums; flex-shrink: 0;
  width: 58px; text-align: right; color: var(--text-dim, #8b949e);
  overflow: hidden; white-space: nowrap;
}
.panel-header {
  padding: 11px 16px; border-bottom: 1px solid var(--glass-border);
  font-size: 13px; font-weight: 700; flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
  letter-spacing: 0.3px;
}
#leftPanel .panel-header { color: var(--accent); }
#rightPanel .panel-header { color: #f2795c; }
.panel-header .count {
  color: var(--text-dim); font-weight: 500; font-size: 11px;
  background: var(--surface-2); padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--glass-border);
}
#towerCards, #unitCards {
  flex: 1; overflow-y: auto; padding: 10px 12px 14px;
  display: flex; flex-direction: column; gap: var(--gap);
}

/* ==================== 画布 ==================== */
#canvasWrapper { flex: 1; position: relative; background: var(--bg-deep); overflow: hidden; }
#canvasWrap { width: 100%; height: 100%; cursor: grab; position: relative; }
#canvasWrap:active { cursor: grabbing; }
#canvasWrap canvas { display: block; width: 100%; height: 100%; background: #0a0d12; }
/* v2.5D 第5步：唯一画布是 glCanvas，它既是画面也是输入面。
   绝对定位铺满 #canvasWrap；面板类覆盖层 z-index 10~30，仍在最上。 */
#canvasWrap canvas { position: absolute; left: 0; top: 0; }
#glCanvas { background: #0a0d12; }
/* 右下角工具栏。v44：blur/padding 与顶栏对齐（原来是 10px/6px，顶栏是 14px/8px，
   两块浮层的玻璃厚度肉眼能看出差别）。三块浮层现在用同一组参数。 */
#canvasControls {
  position: absolute; bottom: 12px; right: 12px; z-index: 10;
  display: flex; gap: var(--gap-sm); align-items: center;
  background: var(--surface); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: 8px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border); box-shadow: var(--shadow-sm);
}
#canvasControls button { background: var(--surface-3); padding: 3px 11px; font-size: 14px; }
#canvasControls .zoom-label { font-size: 12px; color: var(--text-dim); min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }

/* ==================== 日志 ==================== */
#logArea {
  height: 112px; background: var(--surface); backdrop-filter: blur(10px);
  border-top: 1px solid var(--glass-border);
  overflow-y: auto; padding: 6px 16px; font-size: 11px;
  color: var(--text-dim); flex-shrink: 0;
  font-family: 'Consolas', 'SF Mono', monospace;
  display: none;
}
#logArea.show { display: block; }
#logArea .log-entry { margin-bottom: 2px; line-height: 1.5; }
#logArea .log-entry .time { color: var(--text-mute); margin-right: 8px; }
#logArea .hit-tower { color: #f2795c; }
#logArea .hit-minion { color: var(--accent); }
#logArea .spawn { color: var(--gold); }
#logArea .death { color: var(--text-mute); }

/* ==================== 单位卡片 ==================== */
.unit-card {
  background: var(--surface-2); border: 1px solid var(--glass-border);
  border-radius: var(--radius); padding: 12px 14px; font-size: 12px;
  transition: opacity 0.2s, border-color 0.2s, box-shadow 0.2s;
  box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
  flex-shrink: 0;
}
.unit-card::before {
  content: ''; position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--glass-highlight), transparent);
}
.unit-card:hover { border-color: rgba(255,255,255,0.16); }
.unit-card.dead { opacity: 0.38; background: rgba(13,16,19,0.7); border-color: rgba(74,58,58,0.6); }
.unit-card .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.unit-card .card-header .id { color: var(--text-dim); font-size: 11px; font-weight: 600; }
.unit-card .type-tag {
  font-size: 10px; padding: 2px 9px; border-radius: 999px;
  letter-spacing: 0.5px; font-weight: 600;
}
.type-tower { background: rgba(79,209,197,0.16); color: var(--accent); }
.type-melee { background: rgba(242,121,92,0.16); color: #f2795c; }
.type-ranged { background: rgba(224,194,91,0.16); color: #e0c25b; }
.type-siege { background: rgba(176,124,240,0.16); color: #b07cf0; }
.type-totem { background: rgba(142,68,173,0.22); color: var(--purple); }
.type-super { background: rgba(192,57,43,0.22); color: #e74c3c; }
.type-shield { background: rgba(91,155,213,0.18); color: var(--accent-2); }
.type-warlock { background: rgba(142,68,173,0.2); color: #c9a0ff; }
.type-corrupt { background: rgba(107,142,35,0.2); color: #a8c964; }
.type-dragon { background: rgba(246,201,74,0.2); color: var(--gold); }

/* 血条 */
.bar-row { display: flex; align-items: stretch; height: 14px; margin-bottom: 3px; }
.bar-track { position: relative; flex: 1; height: 100%; background: var(--bg-deep); border: 1px solid var(--glass-border); border-radius: 4px; overflow: hidden; }
.bar-hp-trail { position: absolute; top: 0; left: 0; height: 100%; background: #a68a2e; transition: width 0.45s ease-out; pointer-events: none; }
.bar-hp { position: absolute; top: 0; left: 0; height: 100%; background: linear-gradient(180deg, #5cc85f, #43a047); transition: width 0.08s linear; }
.tower-bar .bar-hp { background: linear-gradient(180deg, #6bb8f0, #3d8fd1); }
/* 阵营血条颜色：统一 2D 画布与卡片UI的配色，取代此前的"低血量变红" */
.bar-hp.faction-blue { background: linear-gradient(180deg, #6bb8f0, #3d8fd1); }
.bar-hp.faction-red { background: linear-gradient(180deg, #ff8a7a, #d0453b); }
.bar-shield-fixed { position: absolute; top: 0; height: 100%; background: repeating-linear-gradient(45deg, #ffffff, #ffffff 3px, rgba(255,255,255,0.5) 3px, rgba(255,255,255,0.5) 6px); transition: width 0.1s, left 0.1s; }
.bar-shield-temp { position: absolute; top: 0; height: 100%; background: repeating-linear-gradient(45deg, #ffffff, #ffffff 3px, rgba(255,255,255,0.3) 3px, rgba(255,255,255,0.3) 6px); transition: width 0.1s, left 0.1s; }
.bar-text { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); margin-bottom: 5px; font-variant-numeric: tabular-nums; }
.bar-text .shield-total { color: #cfd6dd; }

/* 属性 */
.attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; font-size: 11px; margin: 4px 0; }
.attrs .a { display: flex; justify-content: space-between; color: var(--text-dim); }
.attrs .a span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
.attrs-ext { display: none; grid-template-columns: 1fr 1fr; gap: 2px 14px; font-size: 11px; margin: 4px 0; padding-top: 5px; border-top: 1px solid var(--glass-border); }
.attrs-ext.open { display: grid; }
.attrs-ext .a { display: flex; justify-content: space-between; color: var(--text-dim); }
.attrs-ext .a span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
.toggle-ext { font-size: 10px; color: var(--text-dim); cursor: pointer; background: none; border: none; padding: 2px 4px; }
.toggle-ext:hover { color: var(--text); }

/* 技能栏 */
.skill-slot-row { display: flex; gap: var(--gap-sm); flex-wrap: wrap; margin: 5px 0 4px; padding: 2px 0; }
.skill-slot {
  width: 34px; height: 34px; border-radius: 50%; background: var(--surface-3);
  border: 2px solid var(--glass-border); display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--text-dim); flex-shrink: 0; position: relative; cursor: pointer;
  transition: transform 0.12s, box-shadow 0.15s;
}
.skill-slot:hover { transform: scale(1.1); box-shadow: 0 0 0 2px rgba(91,155,213,0.3); z-index: 2; }
.skill-slot.has-skill { border-style: solid; border-color: var(--accent-2); background: rgba(30,42,58,0.9); }
.skill-slot.disabled { opacity: 0.4; filter: grayscale(1); border-color: var(--text-mute) !important; }
/* v37（Q1）：嵌套分组样式已删除——技能栏回归平铺（加固城防+成长仅在身份技能描述中合并显示） */

.skill-placeholder { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-3); border: 2px dashed var(--glass-border); opacity: 0.3; flex-shrink: 0; }

/* 效果栏 */
.effect-row { display: flex; flex-wrap: wrap; gap: var(--gap-sm); margin: 5px 0 4px; align-items: center; padding: 2px 0; }
.effect-icon {
  width: 34px; height: 34px; border-radius: var(--radius-xs); background: var(--surface-3);
  border: 1.5px solid var(--glass-border); display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0; position: relative; cursor: pointer; overflow: hidden;
  transition: transform 0.12s, box-shadow 0.15s;
}
.effect-icon:hover { transform: scale(1.1); box-shadow: 0 0 0 2px rgba(91,155,213,0.3); z-index: 2; }
.effect-icon.debuff { border-color: rgba(192,57,43,0.6); }
.effect-icon .effect-icon-glyph { position: relative; z-index: 1; pointer-events: none; }
.effect-icon .effect-cd-ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; border-radius: var(--radius-xs); background: none; }
.effect-icon .effect-badge-value { position: absolute; right: -3px; bottom: -3px; min-width: 15px; height: 14px; padding: 0 2px; border-radius: 4px; background: var(--bg-deep); border: 1px solid var(--glass-border); font-size: 9px; line-height: 14px; text-align: center; color: var(--text); z-index: 2; pointer-events: none; }
.effect-placeholder { width: 34px; height: 34px; border-radius: var(--radius-xs); background: var(--surface-3); border: 1.5px dashed var(--glass-border); opacity: 0.3; flex-shrink: 0; }

.card-actions { display: flex; gap: var(--gap-sm); margin-top: 6px; flex-wrap: wrap; }
.card-actions button { font-size: 11px; padding: 4px 10px; }

/* ==================== 统一"可选卡片"组件 ====================
   取代此前并行的 build-skill-icon / weapon-option / skill-option / ds-card 四套样式。
   武器/被动技能/龙魂/所有选择类tab 统一使用这一套，保证视觉语言一致。 */
.pick-grid { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.pick-card {
  background: var(--surface-3); border: 1px solid var(--glass-border); border-radius: 999px;
  display: inline-flex; flex-direction: row; align-items: center; justify-content: center;
  cursor: pointer; gap: 5px; padding: 5px 12px; text-align: center; white-space: nowrap;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.pick-card:hover { background: rgba(58,70,86,0.9); border-color: var(--accent-2); }
.pick-card.selected {
  background: rgba(79,209,197,0.16); border-color: var(--accent); color: var(--text);
}
.pick-card.has-stacks {
  background: rgba(246,201,74,0.14); border-color: var(--gold); color: var(--text);
}
.pick-card .pick-icon { font-size: 14px; line-height: 1; }
.pick-card .pick-label { font-size: 12px; color: var(--text-dim); }
.pick-card.selected .pick-label, .pick-card.has-stacks .pick-label { color: var(--text); }
.pick-desc-box {
  margin-top: 8px; padding: 9px 12px; background: var(--bg-deep); border: 1px solid var(--glass-border);
  border-radius: var(--radius-xs); font-size: 12px; color: var(--text-dim); min-height: 36px; line-height: 1.55;
}
.uad-section-label { color: var(--text-dim); font-size: 12px; display: block; margin-bottom: 6px; }
.uad-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.uad-card {
  background: var(--surface-3); border: 1.5px solid var(--glass-border); border-radius: var(--radius-sm);
  padding: 18px 10px; text-align: center; cursor: pointer;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
}
.uad-card:hover { transform: translateY(-3px); border-color: var(--accent-2); box-shadow: 0 6px 16px rgba(0,0,0,0.35); }
.uad-card .uad-icon { font-size: 32px; line-height: 1.2; }
.uad-card .uad-label { font-size: 13px; font-weight: 600; margin-top: 6px; color: var(--text); }
.uad-queue-box { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--glass-border); }
.uad-queue-title { font-size: 12px; color: var(--gold); font-weight: 600; margin-bottom: 8px; }
.uad-queue-list { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
.uad-queue-empty { font-size: 12px; color: var(--text-mute); padding: 10px 4px; }
.uad-queue-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface-3); border-radius: var(--radius-xs); font-size: 12px; }
.uad-queue-item .uad-queue-icon { font-size: 16px; }
.uad-queue-item .uad-queue-label { font-weight: 600; min-width: 60px; }
.uad-queue-item .uad-queue-summary { flex: 1; color: var(--text-dim); }
.uad-queue-item .uad-queue-remove { background: none; border: none; color: var(--warn); cursor: pointer; font-size: 13px; padding: 2px 6px; }
.build-options .option-group { margin-bottom: 8px; }

/* 编辑器 */
.editor-tabs { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
.editor-tab { padding: 6px 14px; border-radius: 999px; font-size: 12px; cursor: pointer; background: var(--surface-3); border: 1px solid var(--glass-border); color: var(--text-dim); transition: all 0.15s; }
.editor-tab:hover { color: var(--text); }
.editor-tab.active { background: linear-gradient(135deg, rgba(37,74,92,0.9), rgba(91,155,213,0.3)); border-color: var(--accent-2); color: var(--text); }
.editor-mode-switch { display: flex; gap: var(--gap-sm); margin-bottom: 12px; }
.editor-section { margin-bottom: 14px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); }
.editor-section h4 { margin: 0 0 8px; font-size: 12px; color: #8fd0ff; }

.slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 12px; }
.slider-row label { width: 130px; flex-shrink: 0; color: var(--text-dim); }
.slider-wrap { display: flex; align-items: center; gap: 8px; flex: 1; }
.slider-row input[type="range"] { flex: 1; accent-color: var(--accent-2); height: 4px; }
.editor-slider { flex: 1; accent-color: var(--accent-2); }
.slider-row input[type="number"], .editor-number { width: 82px; flex-shrink: 0; background: var(--bg-deep); border: 1px solid var(--glass-border); color: var(--text); padding: 4px 7px; border-radius: var(--radius-xs); font-variant-numeric: tabular-nums; }
.slider-row select, .editor-select { flex: 1; background: var(--bg-deep); border: 1px solid var(--glass-border); color: var(--text); padding: 4px 7px; border-radius: var(--radius-xs); }

.editor-checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 8px; color: var(--text-dim); }
.status-list-item { display: flex; align-items: center; gap: 8px; padding: 6px 9px; background: var(--surface-3); border-radius: var(--radius-xs); margin-bottom: 5px; font-size: 12px; }
.status-list-item span.name { flex: 1; }
.status-list-item button { padding: 3px 9px; font-size: 11px; }

/* ==================== 模板编辑器：左树 + 右表单 ====================
   原来是三层横向页签（大类 → 类型 → 内容页），一屏最多能出现四行胶囊按钮，
   而且"我现在在编辑谁"要横着读三行才拼得出来。改为左侧固定导航树：
   位置感由纵向层级承担，右侧只剩"当前页在编辑什么"这一件事。 */
.tpl-layout { display: flex; gap: 14px; align-items: flex-start; }
.tpl-nav {
  width: 168px; flex-shrink: 0; max-height: 58vh; overflow-y: auto;
  border-right: 1px solid var(--glass-border); padding-right: 10px;
}
.tpl-nav-group { margin-bottom: 10px; }
.tpl-nav-title {
  font-size: 10px; letter-spacing: 0.06em; color: var(--text-mute);
  text-transform: uppercase; padding: 0 6px 4px;
}
.tpl-nav-item {
  display: block; width: 100%; text-align: left; padding: 5px 9px; margin-bottom: 2px;
  font-size: 12px; border-radius: var(--radius-xs); cursor: pointer;
  background: transparent; border: 1px solid transparent; color: var(--text-dim);
  transition: all 0.12s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tpl-nav-item:hover { color: var(--text); background: var(--surface-3); }
.tpl-nav-item.active {
  background: linear-gradient(135deg, rgba(37,74,92,0.9), rgba(91,155,213,0.28));
  border-color: var(--accent-2); color: var(--text);
}
.tpl-nav-item.child { padding-left: 22px; font-size: 11.5px; }
.tpl-nav-item.open { color: var(--text); font-weight: 600; }
.tpl-caret { display: inline-block; width: 10px; font-size: 9px; color: var(--text-mute); }
.tpl-pane { flex: 1; min-width: 0; max-height: 58vh; overflow-y: auto; padding-right: 4px; }
.tpl-pane-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.tpl-pane-head .tpl-crumb { font-size: 13px; font-weight: 600; }
.tpl-pane-head .tpl-crumb-sub { font-size: 11px; color: var(--text-mute); }
/* 即时生效角标：区分"点了就生效"与"改完要点应用"。两种控件混在一页而不加区分，
   是用户反复问"我改了到底生效没有"的直接原因。 */
.tpl-instant {
  font-size: 9px; color: #f6c94a; border: 1px solid rgba(246,201,74,0.5);
  border-radius: 3px; padding: 0 4px; white-space: nowrap;
}
.tpl-scope-note { font-size: 11px; color: var(--text-mute); margin: 6px 0 4px; }


/* 出兵编排表：表头与数据行共用同一套列宽，两边各写一串 px 必然错位 */
.wo-row {
  display: grid;
  grid-template-columns: 54px minmax(88px, 1.1fr) 56px 56px 56px minmax(140px, 2.2fr) 26px;
  gap: 6px; align-items: center; margin-bottom: 6px; font-size: 12px;
}
.wo-row.wo-head { font-size: 10px; color: var(--text-mute); margin-bottom: 4px; padding: 0 2px; }
.wo-row.wo-off { opacity: 0.45; }
.wo-row > select, .wo-row > input, .wo-when-cell select, .wo-when-cell input {
  min-width: 0; width: 100%;
  background: var(--bg-deep); border: 1px solid var(--glass-border); color: var(--text);
  padding: 4px 6px; border-radius: var(--radius-xs); font-size: 11.5px;
}
.wo-move-cell { display: flex; gap: 2px; }
.wo-move-cell .wo-move {
  width: 24px; padding: 3px 0; font-size: 10px; line-height: 1;
  background: var(--surface-3); border: 1px solid var(--glass-border);
  color: var(--text-dim); border-radius: var(--radius-xs); cursor: pointer;
}
.wo-move-cell .wo-move:disabled { opacity: 0.3; cursor: default; }
/* 条件列：下拉占满，带参数的条件才追加一个窄数字框 */
.wo-when-cell { display: flex; gap: 4px; min-width: 0; }
.wo-when-cell select { flex: 1; }
.wo-when-cell .wo-arg { flex: 0 0 62px; width: 62px; }
.wo-row .wo-del {
  width: 26px; padding: 4px 0; background: #b33a3a; border: none;
  color: #fff; border-radius: var(--radius-xs); cursor: pointer; font-size: 11px; line-height: 1;
}

/* ==================== 弹窗 ==================== */
.modal-overlay { position: fixed; inset: 0; background: rgba(4,6,9,0.68); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 300; display: none; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border); border-radius: var(--radius);
  padding: 22px 26px; max-width: 620px; width: 92%;
  max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow);
}
.modal-box h3 { margin-bottom: 14px; font-size: 16px; font-weight: 700; }
#modalTitle { margin-bottom: 14px; font-size: 16px; font-weight: 700; }
.modal-box .row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 13px; gap: 12px; }
.modal-box .row label { color: var(--text-dim); flex-shrink: 0; min-width: 70px; }
.modal-box .row input, .modal-box .row select { flex: 1; text-align: left; }
.modal-box .row input[type="number"] { width: 100px; }
.modal-actions, .modal-box .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.modal-actions button, .modal-box .modal-actions button { padding: 7px 18px; }

/* ==================== 穿梭框（龙魂等"选择生效项"通用组件） ==================== */
.transfer-box { display: flex; flex-direction: column; gap: 12px; }
.transfer-active-zone {
  padding: 10px 12px; background: rgba(246,201,74,0.06); border: 1px solid rgba(246,201,74,0.22);
  border-radius: var(--radius-sm); min-height: 64px;
}
.transfer-active-title { font-size: 12px; color: var(--gold); font-weight: 600; margin-bottom: 8px; }
.transfer-active-list { display: flex; flex-wrap: wrap; gap: 8px; }
.transfer-active-empty { font-size: 12px; color: var(--text-mute); padding: 6px 2px; }
.transfer-chip {
  display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px;
  background: var(--surface-3); border: 1.5px solid var(--gold); border-radius: 999px;
  font-size: 12px; cursor: pointer; transition: background 0.15s;
}
.transfer-chip:hover { background: rgba(224,71,63,0.18); border-color: var(--warn); }
.transfer-chip .chip-icon { font-size: 15px; }
.transfer-chip .chip-remove { color: var(--text-mute); font-size: 11px; }
.transfer-chip:hover .chip-remove { color: var(--warn); }
.transfer-pool-section { margin-top: 4px; }
.transfer-pool-title { font-size: 11.5px; color: var(--text-dim); font-weight: 600; margin: 10px 0 6px; }

@media (max-width: 1024px) {
}
@media (max-width: 768px) {
  #main { flex-direction: column-reverse; }
  #canvasWrapper { height: 100vh; }
  #selectionPanel { width: 88vw; }
}
</style>
</head>
<body>
<div id="topbar">
  <span class="stat">波次 <b id="waveNum">0</b></span>
  <span class="sep">|</span>
  <span class="stat">下一波 <b id="waveTimer">0.0s</b></span>
  <span class="sep">|</span>
  <span class="stat">塔数 <b id="towerCount">0</b></span>
  <span class="sep">|</span>
  <span class="stat">小兵 <b id="minionCount">0</b></span>
  <span class="sep">|</span>
  <!-- v44：击杀数不再上顶栏（用户："杀了多少个兵就不要显示了，只显示塔数就行"）。
       击杀仍然照常统计（CTX.__score.*.kills），只是不占顶栏这一格 —— 那是最贵的一块地方。 -->
  <span class="stat" id="scoreBoard" title="推塔数">🔵 <b id="scoreBlue">0</b> ⚔ 🔴 <b id="scoreRed">0</b></span>

  <span class="spacer"></span>
  <div class="btn-group">
    <button id="modeBtn" class="dragon">🗺️ 沙盒模式</button>
    <button class="primary" id="addUnitBtn">➕ 添加单位</button>
    <button id="templateEditorBtn" class="primary">📐 模板编辑器</button>
    <button id="settingsBtn">⚙️ 设置</button>
    <button id="toggleLogBtn">📜 日志</button>
  </div>
</div>

<div id="dragonBanner">
  <span id="dragonBannerText">🐉 巨龙即将降临</span>
  <span class="db-timer" id="dragonBannerTimer"></span>
</div>

<div id="main">
  <!-- 两侧常驻属性栏已移除（性能：每帧 O(单位数) 的 DOM 读写是主线程最大杀手之一）。
       改为 LoL 式点选：点击画布上的单位，左上角弹出属性面板（selectionPanel），
       实时刷新、保留原有的编辑/删除/击杀按钮与技能/效果图标交互。 -->
  <div id="canvasWrapper">
    <!-- 世界状态小窗（右上角）：时间/昼夜 · 天气 · 熵 三段合并在一个窗口里分开显示。
         统一设计语言：同一块玻璃面板、同样的行高与字号，每段一行、左侧固定宽度的标签位。
         点天气段开天气配置，点熵段开世界设置。 -->
    <div id="worldHud">
      <!-- 布局（v44 用户定稿）：**三条竖排**，每条独占一行。
           用户："主窗口右上角的天气条，时间条，熵条应该是竖着排列的。"
           这**推翻了上一版**（时间与天气并成一行）—— 上一版的注释还写着
           "上一版我把三者做成了三行，那是理解错了"，现在又回到三行。
           如实记在这里：这一处我来回改过两次，最终以本次为准。
           并排那一版还有个副作用：天气段被裹在 #whTimeRow 里，
           而 CSS 的 `.wh-row[title]:not(#whTimeRow) { cursor:pointer }` 恰好把它排除了，
           于是"天气可点"这件事没有任何视觉提示 —— 用户报的"天气那个无法点击"就是这个。
           拆成独立一行之后它自然拿回 pointer 光标与 hover 描边。 -->
      <div class="wh-row" id="whTimeRow" title="游戏时间 · 昼夜相位">
        <span class="wh-label" id="whPhaseIcon">☀️</span>
        <canvas id="whTimeBar" class="wh-bar"></canvas>
        <span class="wh-val" id="whClock">0:00</span>
      </div>
      <div class="wh-row" id="whWeatherRow" style="display:none;" title="当前天气 · 点击打开天气配置">
        <span class="wh-label" id="weatherNow"></span>
        <canvas id="weatherBar" class="wh-bar"></canvas>
        <span class="wh-val" id="whWeatherVal"></span>
      </div>
      <div class="wh-row" id="whEntropyRow" style="display:none;" title="三核总数恒为 8 · 点击打开世界设置">
        <span class="wh-label" id="whEntIcon">🌀</span>
        <canvas id="whEntBar" class="wh-bar"></canvas>
        <span class="wh-val" id="whEntVal"></span>
      </div>
    </div>

    <div id="canvasWrap">
      <canvas id="glCanvas"></canvas>
      <div id="canvasControls">
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button id="zoomInBtn">+</button>
        <button id="zoomOutBtn">−</button>
        <button id="resetViewBtn" title="重置视角（全图）">🎯</button>
        <span class="zoom-label" id="elevLabel" title="视角俯仰角">45°</span>
        <input id="elevSlider" type="range" min="20" max="85" step="1" value="45" title="视角俯仰角（20°=贴地平视，85°=近俯视）" style="width:96px;vertical-align:middle;">
        <span class="zoom-label" id="azimLabel" title="视角方位（东南西北）">北</span>
        <input id="azimSlider" type="range" min="0" max="360" step="1" value="0" title="视角方位角（0北 / 90东 / 180南 / 270西）· 靠近四方向自动吸附" style="width:96px;vertical-align:middle;">
      </div>
      <div id="selectionPanel">
        <!-- v33（Q11）：✕ 关闭按钮已删（点击画布空白处即取消选中）；
             左 = #id 单位名，右 = 阵营·层级徽标 + 图标化的编辑/删除按钮 -->
        <div id="selectionHeader">
          <span id="selectionTitle">单位详情</span>
          <span style="display:flex;align-items:center;gap:6px;">
            <span id="selectionBadge"></span>
            <span id="selectionActions"></span>
          </span>
        </div>
        <div id="selectionCard"></div>
      </div>
      <div id="perfHud"></div>
    </div>
  </div>
</div>

<div id="logArea"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <h3 id="modalTitle">提示</h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
